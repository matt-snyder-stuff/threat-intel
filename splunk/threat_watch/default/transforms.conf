# ---------------------------------------------------------------------------
# KV Store lookup: threat_intel_clusters_lookup
# Exposes the threat_intel_clusters KV Store collection as a lookup table.
# Searches can enrich any field against cluster_id with:
#   | lookup threat_intel_clusters_lookup cluster_id OUTPUT reach_score, ...
# ---------------------------------------------------------------------------
[threat_intel_clusters_lookup]
collection = threat_intel_clusters
external_type = kvstore
fields_list = _key, cluster_id, reach_score, size, cloud_tags, ai_tags, publishers, threat_actors, lead_name, lead_url, ingested_at

# ---------------------------------------------------------------------------
# KV Store lookup: threat_intel_iocs_lookup
# Exposes the threat_intel_iocs KV Store collection as a lookup table.
# Searches can enrich any field against the ioc key with:
#   | lookup threat_intel_iocs_lookup ioc OUTPUT ioc_type, source_report, ...
# ---------------------------------------------------------------------------
[threat_intel_iocs_lookup]
collection = threat_intel_iocs
external_type = kvstore
fields_list = _key, ioc, ioc_type, source_report, source_url, labels, confidence, first_seen, last_seen
