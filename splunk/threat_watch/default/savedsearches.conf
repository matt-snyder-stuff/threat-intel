# =============================================================================
# Threat Watch — Saved Searches
# =============================================================================
# All searches target the "threat_intel" index by default. Adjust index = and
# sourcetype = values as needed for your environment.
#
# KV Store collections referenced:
#   threat_intel_clusters  (via threat_intel_clusters_lookup)
#   threat_intel_iocs      (via threat_intel_iocs_lookup)
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Ingest Clusters — hourly ETL from threat_intel index to KV Store
# -----------------------------------------------------------------------------
# Reads the most recent threat-watch-data.json event written to Splunk by the
# pipeline (sourcetype=threat_watch), extracts each entry in cloud_clusters[],
# and upserts it into the threat_intel_clusters KV Store collection.
# The cluster_id is a stable hash of (lead report id + ingestion timestamp).
# -----------------------------------------------------------------------------
[Threat Watch - Ingest Clusters]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 5 * * * *
description = Hourly ETL: parse the latest threat-watch-data.json event from the threat_intel index and upsert cloud cluster records into the threat_intel_clusters KV Store collection.
dispatch.earliest_time = -90m
dispatch.latest_time = now
enableSched = 1
realtime_schedule = 0
search = index=threat_intel sourcetype=threat_watch \
| dedup _time sortby -_time \
| head 1 \
| spath input=_raw \
| spath output=clusters path=cloud_clusters{} \
| mvexpand clusters \
| spath input=clusters output=reach_score   path=reach_score \
| spath input=clusters output=size          path=size \
| spath input=clusters output=cloud_tags    path=cloud_tags{} \
| spath input=clusters output=ai_tags       path=ai_tags{} \
| spath input=clusters output=publishers    path=publishers{} \
| spath input=clusters output=threat_actors path=threat_actors{} \
| spath input=clusters output=lead_id       path=lead.id \
| spath input=clusters output=lead_name     path=lead.name \
| spath input=clusters output=lead_url      path=lead.url \
| eval cluster_id = md5(lead_id . strftime(now(), "%Y-%m-%dT%H")) \
| eval ingested_at = strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| eval cloud_tags    = mvjoin(cloud_tags,    "|") \
| eval ai_tags       = mvjoin(ai_tags,       "|") \
| eval publishers    = mvjoin(publishers,    "|") \
| eval threat_actors = mvjoin(threat_actors, "|") \
| table cluster_id, reach_score, size, cloud_tags, ai_tags, publishers, threat_actors, lead_name, lead_url, ingested_at \
| append [ | inputlookup threat_intel_clusters_lookup ] \
| sort -ingested_at \
| dedup cluster_id \
| outputlookup threat_intel_clusters_lookup


# -----------------------------------------------------------------------------
# Ingest IOCs — hourly ETL from threat_intel index to KV Store
# -----------------------------------------------------------------------------
# Reads the most recent threat-watch-data.json event (sourcetype=threat_watch),
# reads canonical IOC arrays and report metadata from cloud_clusters{} and
# last_24h.reports{},
# deduplicates against the existing threat_intel_iocs KV Store, and upserts
# updated records. Runs 10 minutes after Ingest Clusters so cluster records
# are already available for context.
# RFC1918 addresses and common infra domains are filtered out.
# -----------------------------------------------------------------------------
[Threat Watch - Ingest IOCs]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 15 * * * *
description = Hourly ETL: ingest canonical IOCs and report metadata from the latest threat-watch-data.json event into the threat_intel_iocs KV Store collection.
dispatch.earliest_time = -90m
dispatch.latest_time = now
enableSched = 1
realtime_schedule = 0
search = index=threat_intel sourcetype=threat_watch \
| dedup _time sortby -_time \
| head 1 \
| spath input=_raw \
| spath output=cluster_reports path="cloud_clusters{}.reports{}" \
| spath output=recent_reports path="last_24h.reports{}" \
| eval reports=mvappend(cluster_reports, recent_reports) \
| mvexpand reports \
| spath input=reports output=source_report path=id \
| spath input=reports output=report_name path=name \
| spath input=reports output=labels path=labels{} \
| spath input=reports output=confidence path=confidence \
| spath input=reports output=tlp path=tlp \
| spath input=reports output=valid_until path=valid_until \
| spath input=reports output=ioc_cve path=iocs.cve{} \
| spath input=reports output=ioc_ip path=iocs.ipv4{} \
| spath input=reports output=ioc_domain path=iocs.domain{} \
| spath input=reports output=ioc_url path=iocs.url{} \
| spath input=reports output=ioc_md5 path=iocs.md5{} \
| spath input=reports output=ioc_sha1 path=iocs.sha1{} \
| spath input=reports output=ioc_sha256 path=iocs.sha256{} \
| eval ts         = strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| eval cve_rows    = if(isnotnull(ioc_cve),    mvmap(ioc_cve,    ioc_cve    . "|||cve"),    null()) \
| eval ip_rows     = if(isnotnull(ioc_ip),     mvmap(ioc_ip,     ioc_ip     . "|||ip"),     null()) \
| eval domain_rows = if(isnotnull(ioc_domain), mvmap(ioc_domain, ioc_domain . "|||domain"), null()) \
| eval url_rows    = if(isnotnull(ioc_url),    mvmap(ioc_url,    ioc_url    . "|||url"),    null()) \
| eval md5_rows    = if(isnotnull(ioc_md5),    mvmap(ioc_md5,    ioc_md5    . "|||md5"),    null()) \
| eval sha1_rows   = if(isnotnull(ioc_sha1),   mvmap(ioc_sha1,   ioc_sha1   . "|||sha1"),   null()) \
| eval sha256_rows = if(isnotnull(ioc_sha256), mvmap(ioc_sha256, ioc_sha256 . "|||sha256"), null()) \
| eval ioc_rows    = mvappend(cve_rows, ip_rows, domain_rows, url_rows, md5_rows, sha1_rows, sha256_rows) \
| mvexpand ioc_rows \
| where isnotnull(ioc_rows) \
| eval ioc      = mvindex(split(ioc_rows, "|||"), 0) \
| eval ioc_type = mvindex(split(ioc_rows, "|||"), 1) \
| where isnotnull(ioc) AND ioc != "" \
| where ioc_type != "ip"     OR NOT match(ioc, "^(10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|127\.)") \
| where ioc_type != "domain" OR NOT match(ioc, "(?i)(google|microsoft|amazon|github|cloudflare|splunk|example|localhost)") \
| eval first_seen = ts \
| eval last_seen  = ts \
| eval labels=mvjoin(labels, "|") \
| table ioc, ioc_type, source_report, report_name, labels, confidence, tlp, valid_until, first_seen, last_seen \
| append [ | inputlookup threat_intel_iocs_lookup ] \
| sort -last_seen \
| dedup ioc \
| eval first_seen = if(isnotnull(first_seen), first_seen, last_seen) \
| outputlookup threat_intel_iocs_lookup


# -----------------------------------------------------------------------------
# 2. Alert: High-Reach Cluster — every 4h
# -----------------------------------------------------------------------------
# Reads the threat_intel_clusters KV Store and fires when any cluster has a
# reach_score >= 75 AND was ingested within the last 24 hours.
# -----------------------------------------------------------------------------
[Threat Watch - Alert: High-Reach Cluster]
action.email.useNSSubject = 1
alert.severity = 3
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = 0 */4 * * *
description = Alert when a new cloud cluster with reach_score >= 75 is detected in the last 24 hours.
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
realtime_schedule = 0
search = | inputlookup threat_intel_clusters_lookup \
| eval ingested_epoch = strptime(ingested_at, "%Y-%m-%dT%H:%M:%SZ") \
| where (now() - ingested_epoch) <= 86400 \
| where reach_score >= 75 \
| sort -reach_score \
| table cluster_id, reach_score, size, cloud_tags, threat_actors, lead_name, lead_url, ingested_at


# -----------------------------------------------------------------------------
# 3. Alert: New Threat Actor — every 6h
# -----------------------------------------------------------------------------
# Compares the threat actor list in clusters ingested in the last 24h against
# the set of actors seen in the prior 7-day window. Any name not present in
# the older window is considered "new" and triggers the alert.
# -----------------------------------------------------------------------------
[Threat Watch - Alert: New Threat Actor]
action.email.useNSSubject = 1
alert.severity = 2
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = 0 */6 * * *
description = Alert when a threat actor appears in the last 24h that was not seen in the prior 7-day window.
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
realtime_schedule = 0
search = | inputlookup threat_intel_clusters_lookup \
| eval ingested_epoch = strptime(ingested_at, "%Y-%m-%dT%H:%M:%SZ") \
| eval age_hours = (now() - ingested_epoch) / 3600 \
| makemv delim="|" threat_actors \
| mvexpand threat_actors \
| where isnotnull(threat_actors) AND threat_actors != "" \
| eval window = if(age_hours <= 24, "recent", "historical") \
| stats count by threat_actors, window \
| eval recent     = if(window="recent",     count, 0) \
| eval historical = if(window="historical", count, 0) \
| stats sum(recent) as recent_count, sum(historical) as historical_count by threat_actors \
| where recent_count > 0 AND historical_count = 0 \
| where recent_count >= 2 \
| rename threat_actors as new_threat_actor \
| join type=left new_threat_actor [ \
    | inputlookup threat_intel_clusters_lookup \
    | makemv delim="|" threat_actors \
    | mvexpand threat_actors \
    | stats max(reach_score) as max_reach_score by threat_actors \
    | rename threat_actors as new_threat_actor ] \
| where isnotnull(max_reach_score) AND max_reach_score >= 50 \
| table new_threat_actor, recent_count, max_reach_score


# -----------------------------------------------------------------------------
# 4. Hunt: Cloud Initial Access — daily at 06:00 UTC
# -----------------------------------------------------------------------------
# Hunts endpoint and auth logs for initial access TTPs (T1078 Valid Accounts,
# T1190 Exploit Public-Facing Application, T1133 External Remote Services)
# correlated against cloud-tagged clusters from the KV Store.
# Adjust the base search (index=...) to match your environment's auth/endpoint
# data model or sourcetype.
# -----------------------------------------------------------------------------
[Threat Watch - Hunt: Cloud Initial Access]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 0 6 * * *
description = Daily hunt for T1078 / T1190 / T1133 initial access TTPs correlated against cloud-tagged threat clusters. Adjust the base index and sourcetype for your environment.
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
realtime_schedule = 0
search = (index=main OR index=endpoint OR index=auth) \
    (action=failure OR action=success) \
    (sourcetype=WinEventLog:Security OR sourcetype=linux_secure OR sourcetype=okta OR sourcetype=aws:cloudtrail) \
| eval ttp = case( \
    match(EventCode, "^(4624|4625|4648)$"),                  "T1078 - Valid Accounts", \
    match(sourcetype, "aws:cloudtrail") AND match(eventName, "^(ConsoleLogin|AssumeRole)$"), "T1078 - Valid Accounts", \
    match(_raw, "(?i)(exploit|cve-|rce|deserialization|log4j|spring4shell)"), "T1190 - Exploit Public-Facing Application", \
    match(_raw, "(?i)(vpn|rdp|citrix|pulse|fortinet|anyconnect) .*(login|connect|auth)"), "T1133 - External Remote Services", \
    true(), null()) \
| where isnotnull(ttp) \
| eval actor_hint = coalesce(user, src_user, userName, "-") \
| eval src_ip     = coalesce(src_ip, src, sourceIPAddress, "-") \
| stats count, values(ttp) as ttps, values(src_ip) as src_ips \
    by actor_hint \
| sort -count \
| rename actor_hint as principal, count as event_count


# -----------------------------------------------------------------------------
# 5. Hunt: AI/LLM Abuse — ad hoc (no schedule)
# -----------------------------------------------------------------------------
# Looks for indicators of AI/LLM abuse across proxy, endpoint, and application
# logs: MCP traffic, prompt injection strings, model API exfiltration patterns,
# and shadow AI tool usage. Enriched with ai_tags clusters from KV Store.
# -----------------------------------------------------------------------------
[Threat Watch - Hunt: AI/LLM Abuse]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 0 0 1 1 *
description = Ad-hoc hunt for AI/LLM abuse indicators — MCP, prompt injection, model exfiltration — correlated against ai_tags clusters in the KV Store. Run on demand; cron is disabled (set to Jan 1 annually as placeholder).
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 0
realtime_schedule = 0
search = (index=main OR index=proxy OR index=endpoint OR index=web) \
| eval ai_indicator = case( \
    match(_raw, "(?i)(model-context-protocol|mcp-server|tool_call|function_call)"), \
        "MCP traffic", \
    match(_raw, "(?i)(ignore previous|disregard instructions|jailbreak|prompt inject|system prompt|\\[\\[SYSTEM\\]\\])"), \
        "Prompt injection", \
    match(_raw, "(?i)(openai\\.com|api\\.anthropic\\.com|generativelanguage\\.googleapis|huggingface\\.co) .*(POST|upload|fine.?tun)"), \
        "Model API write / exfil", \
    match(_raw, "(?i)(cursor|copilot|claude\\.ai|chatgpt|gemini|perplexity) .*(upload|attach|paste|base64)"), \
        "Shadow AI data upload", \
    match(_raw, "(?i)(embedding|tokenize|inference) .*(secret|password|token|key|ssn|pii)"), \
        "Sensitive data in AI payload", \
    true(), null()) \
| where isnotnull(ai_indicator) \
| eval src_ip  = coalesce(src_ip, src, c_ip, clientip, "-") \
| eval user    = coalesce(user, src_user, userName, cs_username, "-") \
| eval dest    = coalesce(dest, dest_host, url, uri, "-") \
| lookup threat_intel_clusters_lookup cluster_id OUTPUT ai_tags, threat_actors, reach_score \
| where isnotnull(ai_tags) AND ai_tags != "" \
| stats count, values(ai_indicator) as indicators, values(dest) as destinations, values(ai_tags) as ai_cluster_tags \
    by user, src_ip \
| sort -count \
| rename user as principal, count as event_count, src_ip as source_ip


# -----------------------------------------------------------------------------
# 6. Expire Old IOCs — daily at 02:00 UTC
# -----------------------------------------------------------------------------
# Reads the threat_intel_iocs KV Store collection and applies type-specific TTLs
# to mark IOCs as expired or active. The updated collection is written back in
# place, so subsequent searches and alerts automatically skip stale indicators.
#   ip:     30 days
#   domain: 90 days
#   hash:   180 days
#   cve:    365 days
# -----------------------------------------------------------------------------
[Threat Watch - Expire Old IOCs]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 0 2 * * *
description = Daily maintenance: apply type-specific TTLs to threat_intel_iocs_lookup (ip=30d, domain=90d, hash=180d, cve=365d) and write the status field (active / expired) back to the KV Store.
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
realtime_schedule = 0
search = | inputlookup threat_intel_iocs_lookup \
| eval first_seen_epoch = strptime(first_seen, "%Y-%m-%dT%H:%M:%SZ") \
| eval age_days = (now() - first_seen_epoch) / 86400 \
| eval ttl_days = case( \
    ioc_type="ip",     30, \
    ioc_type="domain", 90, \
    ioc_type="hash",   180, \
    ioc_type="cve",    365, \
    true(),            90) \
| eval status = if(age_days > ttl_days, "expired", "active") \
| fields - age_days, ttl_days, first_seen_epoch \
| outputlookup threat_intel_iocs_lookup
