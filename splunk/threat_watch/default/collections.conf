# ---------------------------------------------------------------------------
# KV Store collection: threat_intel_clusters
# One record per cloud cluster from the threat-watch-data.json cloud_clusters[]
# array. Populated by the "Threat Watch — Ingest Clusters" saved search.
# ---------------------------------------------------------------------------
[threat_intel_clusters]
field.cluster_id    = string
field.reach_score   = string
field.size          = string
field.cloud_tags    = string
field.ai_tags       = string
field.publishers    = string
field.threat_actors = string
field.lead_name     = string
field.lead_url      = string
field.ingested_at   = string
accelerated_fields.by_reach = {"reach_score": 1}
accelerated_fields.by_time  = {"ingested_at": 1}

# ---------------------------------------------------------------------------
# KV Store collection: threat_intel_iocs
# Extracted IOC watchlist — IPs, domains, file hashes, CVE identifiers.
# Key field is the IOC value itself for natural deduplication on upsert.
# ---------------------------------------------------------------------------
[threat_intel_iocs]
field.ioc           = string
field.ioc_type      = string
field.source_report = string
field.source_url    = string
field.labels        = string
field.confidence    = string
field.first_seen    = string
field.last_seen     = string
accelerated_fields.by_type     = {"ioc_type": 1}
accelerated_fields.by_first    = {"first_seen": 1}
