version: "3.8"

# Full OpenCTI stack for local demo access.
# Login: admin@opencti.io / ChangeMe1234!
# UI:    http://localhost:8080
#
# Usage:
#   docker compose -f tests/docker-compose.opencti.yml up -d
#   # wait ~90s for platform to be ready
#   python3 tests/seed_opencti.py
#   open http://localhost:8080
#
# Stop:
#   docker compose -f tests/docker-compose.opencti.yml down -v

networks:
  opencti-net:

volumes:
  esdata:
  s3data:
  redisdata:
  amqpdata:

services:
  redis:
    image: redis:7.2
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - opencti-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - opencti-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opencti
      MINIO_ROOT_PASSWORD: changeme_minio
    volumes:
      - s3data:/data
    networks:
      - opencti-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.12-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: opencti
      RABBITMQ_DEFAULT_PASS: changeme_rabbit
    volumes:
      - amqpdata:/var/lib/rabbitmq
    networks:
      - opencti-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20

  opencti:
    image: opencti/platform:6.2.18
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=8096
      APP__PORT: 8080
      APP__BASE_URL: http://localhost:8080
      APP__ADMIN__EMAIL: admin@opencti.io
      APP__ADMIN__PASSWORD: ChangeMe1234!
      APP__ADMIN__TOKEN: "8ac2c1f9-0b3d-4f24-a621-4c9b1f2e5a37"
      REDIS__HOSTNAME: redis
      REDIS__PORT: 6379
      ELASTICSEARCH__URL: http://elasticsearch:9200
      MINIO__ENDPOINT: minio
      MINIO__PORT: 9000
      MINIO__USE_SSL: "false"
      MINIO__ACCESS_KEY: opencti
      MINIO__SECRET_KEY: changeme_minio
      RABBITMQ__HOSTNAME: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__USERNAME: opencti
      RABBITMQ__PASSWORD: changeme_rabbit
      SMTP__HOSTNAME: localhost
      SMTP__PORT: 25
    ports:
      - "8080:8080"
    networks:
      - opencti-net
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q '\"status\":\"operational\"' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
