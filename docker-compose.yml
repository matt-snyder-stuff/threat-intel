x-pipeline-security: &pipeline-security
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777

x-pipeline-environment: &pipeline-environment
  ENVIRONMENT_PROFILE: ${ENVIRONMENT_PROFILE:-}
  REVIEW_STATE_IN: ${REVIEW_STATE_IN:-/data/review-state.json}
  PUBLISH_MAX_TLP: ${PUBLISH_MAX_TLP:-TLP:AMBER}

services:

  # ── Bundled sample source (no network or credentials) ──────────────────────
  sample:
    <<: *pipeline-security
    build: .
    profiles: [sample]
    command: ["--source", "sample", "--build"]
    volumes:
      - ./data:/data
    environment:
      <<: *pipeline-environment
      CUTOFF_DAYS: ${CUTOFF_DAYS:-30}

  # ── RSS source (no credentials needed) ─────────────────────────────────────
  rss:
    <<: *pipeline-security
    build: .
    profiles: [rss]
    command: ["--source", "rss", "--build"]
    volumes:
      - ./data:/data
    environment:
      <<: *pipeline-environment
      RSS_FEEDS: ${RSS_FEEDS:-}
      CUTOFF_DAYS: ${CUTOFF_DAYS:-30}

  # ── OpenCTI source ──────────────────────────────────────────────────────────
  opencti:
    <<: *pipeline-security
    build: .
    profiles: [opencti]
    command: ["--source", "opencti", "--build"]
    volumes:
      - ./data:/data
    environment:
      <<: *pipeline-environment
      OPENCTI_URL: ${OPENCTI_URL}
      OPENCTI_TOKEN: ${OPENCTI_TOKEN}
      CUTOFF_DAYS: ${CUTOFF_DAYS:-30}

  # ── Slack source ────────────────────────────────────────────────────────────
  slack:
    <<: *pipeline-security
    build: .
    profiles: [slack]
    command: ["--source", "slack", "--build"]
    volumes:
      - ./data:/data
    environment:
      <<: *pipeline-environment
      SLACK_TOKEN: ${SLACK_TOKEN}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID}
      SLACK_LOOKBACK_DAYS: ${SLACK_LOOKBACK_DAYS:-30}

  # ── Splunk source ───────────────────────────────────────────────────────────
  splunk:
    <<: *pipeline-security
    build: .
    profiles: [splunk]
    command: ["--source", "splunk", "--build"]
    volumes:
      - ./data:/data
    environment:
      <<: *pipeline-environment
      SPLUNK_URL: ${SPLUNK_URL}
      SPLUNK_TOKEN: ${SPLUNK_TOKEN:-}
      SPLUNK_USERNAME: ${SPLUNK_USERNAME:-}
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-}
      SPLUNK_SEARCH: ${SPLUNK_SEARCH:-}
      SPLUNK_EARLIEST: ${SPLUNK_EARLIEST:--30d@d}
      SPLUNK_VERIFY_SSL: ${SPLUNK_VERIFY_SSL:-true}
      SPLUNK_ALLOWED_INDEXES: ${SPLUNK_ALLOWED_INDEXES:-threat_intel,main}
      SPLUNK_MAX_LOOKBACK_DAYS: ${SPLUNK_MAX_LOOKBACK_DAYS:-90}
      SPLUNK_MAX_RESULTS: ${SPLUNK_MAX_RESULTS:-500}
      CUTOFF_DAYS: ${CUTOFF_DAYS:-30}

  # ── STIX/TAXII source ───────────────────────────────────────────────────────
  stix:
    <<: *pipeline-security
    build: .
    profiles: [stix]
    command: ["--source", "stix", "--build"]
    volumes:
      - ./data:/data
    environment:
      <<: *pipeline-environment
      TAXII_URL: ${TAXII_URL:-}
      TAXII_TOKEN: ${TAXII_TOKEN:-}
      TAXII_USERNAME: ${TAXII_USERNAME:-}
      TAXII_PASSWORD: ${TAXII_PASSWORD:-}
      TAXII_COLLECTION: ${TAXII_COLLECTION:-}
      TAXII_API_ROOT: ${TAXII_API_ROOT:-}
      STIX_URL: ${STIX_URL:-}
      STIX_FILE: ${STIX_FILE:-}
      STIX_VERIFY_SSL: ${STIX_VERIFY_SSL:-true}
      STIX_LIMIT: ${STIX_LIMIT:-500}
      CUTOFF_DAYS: ${CUTOFF_DAYS:-30}

  # ── Static file server — serve threat-watch.html + threat-watch-data.json ──
  # docker compose --profile serve up
  serve:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    profiles: [serve]
    ports:
      - "${SERVE_PORT:-8080}:8080"
    volumes:
      - ./data:/usr/share/nginx/html:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
