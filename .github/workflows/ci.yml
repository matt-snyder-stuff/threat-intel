name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and check security contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m compileall -q run.py check_pipeline.py guardrails sources generator tests
          python -m unittest \
            tests.test_security_contracts \
            tests.test_lifecycle \
            tests.test_splunk_policy \
            tests.test_source_contracts
          make help >/dev/null

      - name: Build and inspect hardened container
        if: matrix.python-version == '3.13'
        run: |
          docker build --tag threat-intel-pipeline:ci .
          test "$(docker image inspect --format '{{.Config.User}}' threat-intel-pipeline:ci)" = "app"

      - name: Exercise OpenCTI pipeline against deterministic mock
        env:
          OPENCTI_URL: http://127.0.0.1:18080/graphql
          OPENCTI_TOKEN: mock-token
          RAW_OUT: ${{ runner.temp }}/tw-30d.json
          PKL_OUT: ${{ runner.temp }}/tw-30d-processed.pkl
          PUB_SIDECAR: ${{ runner.temp }}/tw-30d-published.json
          HTML_OUT: ${{ runner.temp }}/threat-watch.html
          JSON_OUT: ${{ runner.temp }}/threat-watch-data.json
        run: |
          python tests/mock_opencti.py --host 127.0.0.1 --port 18080 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          sleep 1
          python run.py --source opencti --build
          PKL_IN="$PKL_OUT" JSON_IN="$JSON_OUT" python tests/validate.py
          JSON_IN="$JSON_OUT" python tests/validate_json_schema.py

      - name: Check Terraform formatting
        if: matrix.python-version == '3.13'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform
        if: matrix.python-version == '3.13'
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
