name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and check security contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m compileall -q run.py check_pipeline.py guardrails operations sources generator tools tests
          python -m unittest \
            tests.test_security_contracts \
            tests.test_lifecycle \
            tests.test_splunk_policy \
            tests.test_source_contracts \
            tests.test_operator_workflows \
            tests.test_detection_artifacts
          python tools/validate_detections.py
          make help >/dev/null

      - name: Exercise conference quickstart
        run: |
          python quickstart.py --output-dir "${{ runner.temp }}/conference-demo"
          PKL_IN="${{ runner.temp }}/conference-demo/tw-30d-processed.pkl" \
            JSON_IN="${{ runner.temp }}/conference-demo/threat-watch-data.json" \
            python tests/validate.py
          JSON_IN="${{ runner.temp }}/conference-demo/threat-watch-data.json" \
            python tests/validate_json_schema.py

      - name: Build and inspect hardened container
        if: matrix.python-version == '3.13'
        run: |
          docker build --tag threat-intel-pipeline:ci .
          test "$(docker image inspect --format '{{.Config.User}}' threat-intel-pipeline:ci)" = "app"

      - name: Exercise OpenCTI pipeline against deterministic mock
        env:
          OPENCTI_URL: http://127.0.0.1:18080/graphql
          OPENCTI_TOKEN: mock-token
          RAW_OUT: ${{ runner.temp }}/tw-30d.json
          PKL_OUT: ${{ runner.temp }}/tw-30d-processed.pkl
          PUB_SIDECAR: ${{ runner.temp }}/tw-30d-published.json
          HTML_OUT: ${{ runner.temp }}/threat-watch.html
          JSON_OUT: ${{ runner.temp }}/threat-watch-data.json
        run: |
          python tests/mock_opencti.py --host 127.0.0.1 --port 18080 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          sleep 1
          python run.py --source opencti --build
          PKL_IN="$PKL_OUT" JSON_IN="$JSON_OUT" python tests/validate.py
          JSON_IN="$JSON_OUT" python tests/validate_json_schema.py

      - name: Check Terraform formatting
        if: matrix.python-version == '3.13'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform
        if: matrix.python-version == '3.13'
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
